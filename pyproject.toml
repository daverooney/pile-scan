[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pile-scan"
version = "0.1.0"
description = "Resumable OCR and metadata extraction for piles of scanned pages, built for Google Colab."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "pypdfium2>=4.30",
]

# The model runs in llama.cpp's own server (built in the notebook), so there
# are no Python ML dependencies.

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["pile_scan"]

[tool.uv]
# Colab installs into its system Python, so keep the lock usable on any
# Python version Colab might be running.
required-version = ">=0.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
